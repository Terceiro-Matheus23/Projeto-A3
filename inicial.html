
<script>
    // Sincroniza dados da mesa e cliente
    const nomeAtual = localStorage.getItem('aroma_cliente_nome') || 'Cliente';
    const mesaAtual = localStorage.getItem('aroma_mesa_atual') || 'Mesa 05';

    document.getElementById('nome-topo').innerText = `Olá, ${nomeAtual}!`;
    document.getElementById('mesa-topo').innerText = mesaAtual;
    document.getElementById('dock-mesa').innerText = `${mesaAtual} (${nomeAtual})`;

    function trocarNome() {
        const novo = prompt('Qual é o seu nome para a comanda?', nomeAtual);

        if (novo && novo.trim()) {
            localStorage.setItem('aroma_cliente_nome', novo.trim());
            location.reload();
        }
    }

    // Filtro por categoria
    let categoriaAtual = 'todos';

    function filtrar(categoria, btn) {
        categoriaAtual = categoria;

        document.querySelectorAll('.botoes button').forEach(b => {
            b.classList.remove('ativo');
        });

        btn.classList.add('ativo');
        aplicarFiltros();
    }

    // Aplica categoria e busca juntas
    function aplicarFiltros() {
        const termo = document.getElementById('campo-busca').value.toLowerCase().trim();

        document.querySelectorAll('.card').forEach(c => {
            const categoria = c.getAttribute('data-cat');
            const nome = c.getAttribute('data-nome').toLowerCase();

            const correspondeCategoria =
                categoriaAtual === 'todos' || categoria === categoriaAtual;

            const correspondeBusca = nome.includes(termo);

            c.style.display =
                correspondeCategoria && correspondeBusca ? 'flex' : 'none';
        });
    }

    // Busca em tempo real
    document.getElementById('campo-busca').addEventListener('input', aplicarFiltros);
</script>
